name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# superseded pushes stop spending runner time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # tenki runners, a drop-in replacement for GitHub-hosted runners:
    # https://tenki.cloud/docs/runners/quickstart
    # the tenki github app must be installed for this repo's owner, otherwise the job
    # sits in the queue waiting for a runner with this label
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the supported floor and ceiling; every intermediate minor runs the same suite
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: unit suite
        run: python -m pytest -q
      - name: eval gate
        run: python evals/run_evals.py --fail-under 0.9

  integration:
    # the paid runners are the only place the live-backend suite can run at all:
    # falkordb + pgvector come up from docker-compose on an ephemeral tenki VM
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 20
    # main and manual runs only, so pull requests stay cheap
    if: github.event_name != 'pull_request'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: report docker
        run: docker version && docker compose version
      - name: start backends
        run: docker compose up -d --wait --wait-timeout 180
      - name: backend status
        run: docker compose ps
      - name: integration suite
        run: python -m pytest tests/test_integration.py -m integration -q
      - name: backend logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: stop backends
        if: always()
        run: docker compose down -v --remove-orphans
