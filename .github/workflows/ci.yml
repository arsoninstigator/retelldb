name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# superseded pushes stop spending runner time
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # tenki runners, a drop-in replacement for GitHub-hosted runners:
    # https://tenki.cloud/docs/runners/quickstart
    # the tenki github app must be installed for this repo's owner, otherwise the job
    # sits in the queue waiting for a runner with this label
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the supported floor and ceiling; every intermediate minor runs the same suite
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: unit suite
        run: python -m pytest -q
      - name: eval gate
        run: python evals/run_evals.py --fail-under 0.9

  integration:
    # the paid runners are the only place the live-backend suite can run at all:
    # falkordb + pgvector come up from docker-compose on an ephemeral tenki VM
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 20
    # main and manual runs only, so pull requests stay cheap
    if: github.event_name != 'pull_request'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          # the live stores import their client lazily and fall back to memory without it,
          # which silently turns every integration test into a skip
          pip install -e ".[dev]" "falkordb>=0.1.0" "psycopg[binary]>=3.1.0" "pgvector>=0.2.0"
      - name: report docker
        run: docker version && docker compose version
      - name: start backends
        run: docker compose up -d --wait --wait-timeout 180
      - name: backend status
        run: docker compose ps
      - name: probe pgvector
        run: |
          python - <<'PY'
          import psycopg

          dsn = "postgresql://postgres:postgres@localhost:5432/retelldb"
          with psycopg.connect(dsn, autocommit=True) as conn:
              print("server:", conn.execute("select version()").fetchone()[0][:60])
          from pgvector.psycopg import register_vector

          with psycopg.connect(dsn, autocommit=True) as conn:
              register_vector(conn)
              print("vector type registered")
          from retelldb.storage.pgvector_store import PGVectorStore

          store = PGVectorStore()
          print("store connected:", store._connected)
          PY
      - name: integration suite
        run: python -m pytest tests/test_integration.py -m integration -q -rs --log-cli-level=WARNING --junitxml=integration.xml
      - name: no silent skips
        # a skipped integration test is a failure here: the whole point of this job is running them
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse("integration.xml").getroot().find("testsuite")
          cases = list(suite.iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          bad = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          print(f"{len(cases)} integration tests, {bad} failing, {len(skipped)} skipped")
          if skipped:
              print("skipped:", skipped)
              sys.exit(1)
          PY
      - name: backend logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: stop backends
        if: always()
        run: docker compose down -v --remove-orphans
