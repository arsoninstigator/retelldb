name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: unit suite
        run: python -m pytest -q
      - name: eval gate
        run: python evals/run_evals.py --fail-under 0.9

# to activate: move this file to .github/workflows/ci.yml
# (a github token with the `workflow` scope is required to push files under .github/workflows/)
